<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">条件式执行反馈迭代解题率对比</title>
  <desc id="desc">Step 100 至 Step 400 在第一次、第二次和第三次尝试后的累计解题率。</desc>
  <rect width="1000" height="570" fill="#ffffff"/>
  <text x="500" y="35" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172033">执行反馈迭代累计解题率（MBPP 500 题）</text>
  <text x="500" y="62" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#536078">最多三次条件式修复，不等同于标准独立采样 Pass@3</text>

  <g stroke="#dbe1ea" stroke-width="1">
    <line x1="90" y1="450" x2="960" y2="450"/>
    <line x1="90" y1="384.5" x2="960" y2="384.5"/>
    <line x1="90" y1="319.1" x2="960" y2="319.1"/>
    <line x1="90" y1="253.6" x2="960" y2="253.6"/>
    <line x1="90" y1="188.2" x2="960" y2="188.2"/>
    <line x1="90" y1="122.7" x2="960" y2="122.7"/>
    <line x1="90" y1="90" x2="960" y2="90"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#536078" text-anchor="end">
    <text x="78" y="455">0%</text>
    <text x="78" y="389.5">10%</text>
    <text x="78" y="324.1">20%</text>
    <text x="78" y="258.6">30%</text>
    <text x="78" y="193.2">40%</text>
    <text x="78" y="127.7">50%</text>
    <text x="78" y="95">55%</text>
  </g>

  <g>
    <rect x="135" y="172.5" width="42" height="277.5" rx="4" fill="#9db9ff"/>
    <rect x="181" y="150.2" width="42" height="299.8" rx="4" fill="#4f84ff"/>
    <rect x="227" y="142.4" width="42" height="307.6" rx="4" fill="#1554d1"/>

    <rect x="350" y="165.9" width="42" height="284.1" rx="4" fill="#9db9ff"/>
    <rect x="396" y="147.6" width="42" height="302.4" rx="4" fill="#4f84ff"/>
    <rect x="442" y="141.1" width="42" height="308.9" rx="4" fill="#1554d1"/>

    <rect x="565" y="184.3" width="42" height="265.7" rx="4" fill="#9db9ff"/>
    <rect x="611" y="162.0" width="42" height="288.0" rx="4" fill="#4f84ff"/>
    <rect x="657" y="155.5" width="42" height="294.5" rx="4" fill="#1554d1"/>

    <rect x="780" y="189.5" width="42" height="260.5" rx="4" fill="#9db9ff"/>
    <rect x="826" y="173.8" width="42" height="276.2" rx="4" fill="#4f84ff"/>
    <rect x="872" y="163.3" width="42" height="286.7" rx="4" fill="#1554d1"/>
  </g>

  <g font-family="sans-serif" font-size="13" font-weight="700" fill="#172033" text-anchor="middle">
    <text x="156" y="163">42.4</text><text x="202" y="141">45.8</text><text x="248" y="133">47.0</text>
    <text x="371" y="157">43.4</text><text x="417" y="138">46.2</text><text x="463" y="132">47.2</text>
    <text x="586" y="175">40.6</text><text x="632" y="153">44.0</text><text x="678" y="146">45.0</text>
    <text x="801" y="180">39.8</text><text x="847" y="165">42.2</text><text x="893" y="154">43.8</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#293348" text-anchor="middle">
    <text x="202" y="480">Step 100</text>
    <text x="417" y="480">Step 200</text>
    <text x="632" y="480">Step 300</text>
    <text x="847" y="480">Step 400</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#536078">
    <rect x="270" y="520" width="15" height="15" rx="2" fill="#9db9ff"/><text x="293" y="533">第 1 次 / Pass@1</text>
    <rect x="460" y="520" width="15" height="15" rx="2" fill="#4f84ff"/><text x="483" y="533">截至第 2 次解决</text>
    <rect x="665" y="520" width="15" height="15" rx="2" fill="#1554d1"/><text x="688" y="533">截至第 3 次解决</text>
  </g>
</svg>
