<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1260" viewBox="0 0 2200 1260">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#51606b" flood-opacity="0.18"/></filter>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#3b4852"/></marker>
    <marker id="arrV" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#7662b3"/></marker>
    <marker id="arrG" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#4d9662"/></marker>
    <style>
      .cn{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.title{font-size:38px;font-weight:750;fill:#172633}.layer{fill:#fff;stroke-width:2.5}.lh{font-size:26px;font-weight:750}.bt{font-size:23px;font-weight:700;fill:#21333e}.body{font-size:19px;fill:#415762}.small{font-size:17px;fill:#5a6e78}.num{font-size:19px;font-weight:750;fill:#fff}.arrow{fill:none;stroke:#3b4852;stroke-width:3.5;marker-end:url(#arr)}.loop{fill:none;stroke:#7662b3;stroke-width:3.5;stroke-dasharray:10 7;marker-end:url(#arrV)}.positive{fill:none;stroke:#4d9662;stroke-width:3.5;stroke-dasharray:10 7;marker-end:url(#arrG)}
    </style>
  </defs>
  <rect width="2200" height="1260" fill="#fff"/>
  <text x="1100" y="60" text-anchor="middle" class="cn title">面向异构任务数据的统一质量可控扩充框架</text>

  <!-- Layer 1 -->
  <rect x="45" y="95" width="2110" height="250" rx="22" class="layer" fill="#f8fbff" stroke="#4d82d8" filter="url(#shadow)"/>
  <circle cx="80" cy="129" r="21" fill="#3378d4"/><text x="80" y="136" text-anchor="middle" class="cn num">1</text>
  <text x="116" y="138" class="cn lh" fill="#326cc0">输入与预处理层</text>
  <rect x="415" y="108" width="350" height="40" rx="8" fill="#edf4ff" stroke="#76a0dd" stroke-width="1.6"/><text x="590" y="135" text-anchor="middle" class="cn small" fill="#326cc0">统一接收数据、任务描述与质量要求</text>

  <rect x="90" y="177" width="365" height="110" rx="13" fill="#fff" stroke="#7aa2dc" stroke-width="2"/>
  <text x="272" y="212" text-anchor="middle" class="cn bt">异构任务数据</text>
  <rect x="116" y="232" width="96" height="36" rx="18" fill="#e9f2ff"/><rect x="224" y="232" width="110" height="36" rx="18" fill="#e9f2ff"/><rect x="346" y="232" width="82" height="36" rx="18" fill="#e9f2ff"/>
  <text x="164" y="257" text-anchor="middle" class="cn small">表格</text><text x="279" y="257" text-anchor="middle" class="cn small">数学推理</text><text x="387" y="257" text-anchor="middle" class="cn small">代码</text>

  <path d="M455 232H510" class="arrow"/>
  <rect x="525" y="177" width="360" height="110" rx="13" fill="#fff" stroke="#7aa2dc" stroke-width="2"/>
  <text x="705" y="212" text-anchor="middle" class="cn bt">数据清洗</text><text x="705" y="250" text-anchor="middle" class="cn body">格式规范、异常检查与数据隔离</text>
  <path d="M885 232H940" class="arrow"/>
  <rect x="955" y="177" width="360" height="110" rx="13" fill="#fff" stroke="#78a58c" stroke-width="2"/>
  <text x="1135" y="212" text-anchor="middle" class="cn bt">结构化解析</text><text x="1135" y="250" text-anchor="middle" class="cn body">组织输入、目标与上下文信息</text>
  <path d="M1315 232H1370" class="arrow"/>
  <rect x="1385" y="177" width="360" height="110" rx="13" fill="#fff" stroke="#d3a24d" stroke-width="2"/>
  <text x="1565" y="212" text-anchor="middle" class="cn bt">任务约束提取</text><text x="1565" y="250" text-anchor="middle" class="cn body">确定正确性边界与评价依据</text>
  <path d="M1745 232H1800" class="arrow"/>
  <rect x="1815" y="177" width="290" height="110" rx="13" fill="#eaf4ef" stroke="#78a58c" stroke-width="2"/>
  <text x="1960" y="212" text-anchor="middle" class="cn bt">标准化任务表示</text><text x="1960" y="250" text-anchor="middle" class="cn body">进入统一扩充接口</text>

  <!-- connector --> <path d="M1100 345V382" class="arrow"/>

  <!-- Layer 2 -->
  <rect x="45" y="385" width="2110" height="535" rx="22" class="layer" fill="#f8fcfb" stroke="#299486" filter="url(#shadow)"/>
  <circle cx="80" cy="419" r="21" fill="#178d80"/><text x="80" y="426" text-anchor="middle" class="cn num">2</text>
  <text x="116" y="428" class="cn lh" fill="#16796f">质量可控扩充层</text>
  <rect x="815" y="398" width="570" height="40" rx="8" fill="#edf9f7" stroke="#69aa9f" stroke-width="1.6"/><text x="1100" y="425" text-anchor="middle" class="cn small" fill="#16796f">生成模型提出候选 · 任务证据控制质量 · 验证反馈驱动迭代</text>

  <rect x="105" y="500" width="310" height="128" rx="14" fill="#eaf3ff" stroke="#6893cf" stroke-width="2.2"/>
  <circle cx="144" cy="536" r="22" fill="#397bd0"/><text x="144" y="543" text-anchor="middle" class="cn num">1</text>
  <text x="260" y="545" text-anchor="middle" class="cn bt">候选生成</text><text x="260" y="584" text-anchor="middle" class="cn body">生成多样化扩充候选</text>
  <path d="M415 564H495" class="arrow"/>
  <rect x="510" y="500" width="310" height="128" rx="14" fill="#fff2e9" stroke="#da8956" stroke-width="2.2"/>
  <circle cx="549" cy="536" r="22" fill="#da7838"/><text x="549" y="543" text-anchor="middle" class="cn num">2</text>
  <text x="665" y="545" text-anchor="middle" class="cn bt">约束验证</text><text x="665" y="584" text-anchor="middle" class="cn body">任务约束与增益评价</text>

  <path d="M820 564H905" class="arrow"/>
  <polygon points="1040,475 1175,564 1040,653 905,564" fill="#fff8df" stroke="#c59a38" stroke-width="2.4"/>
  <text x="1040" y="548" text-anchor="middle" class="cn bt">质量门控</text><text x="1040" y="582" text-anchor="middle" class="cn small">正确且具有增益？</text>

  <!-- pass branch -->
  <path d="M1175 564H1280" class="arrow"/><text x="1208" y="545" class="cn small" fill="#41815c">通过</text>
  <rect x="1295" y="500" width="320" height="128" rx="14" fill="#eaf6ed" stroke="#6d9e78" stroke-width="2.2"/>
  <circle cx="1334" cy="536" r="22" fill="#4d9662"/><text x="1334" y="543" text-anchor="middle" class="cn num">5</text>
  <text x="1455" y="545" text-anchor="middle" class="cn bt">择优保留</text><text x="1455" y="584" text-anchor="middle" class="cn body">写入结果并更新当前基线</text>

  <path d="M1615 564H1700" class="arrow"/>
  <rect x="1715" y="500" width="340" height="128" rx="14" fill="#eef7f1" stroke="#6d9e78" stroke-width="2.2"/>
  <text x="1885" y="545" text-anchor="middle" class="cn bt">质量可控扩充数据</text><text x="1885" y="584" text-anchor="middle" class="cn body">保留明确有效的监督信息</text>

  <!-- fail branch and regeneration -->
  <path d="M1040 653V700H860" class="arrow"/><text x="1055" y="690" class="cn small" fill="#a1524d">未通过</text>
  <rect x="545" y="715" width="310" height="128" rx="14" fill="#f2effb" stroke="#8e7ac6" stroke-width="2.2"/>
  <circle cx="584" cy="751" r="22" fill="#7662b3"/><text x="584" y="758" text-anchor="middle" class="cn num">3</text>
  <text x="700" y="760" text-anchor="middle" class="cn bt">反馈优化</text><text x="700" y="795" text-anchor="middle" class="cn body">归纳有效方向与拒绝原因</text><text x="700" y="823" text-anchor="middle" class="cn small">更新后续候选生成策略</text>
  <path d="M545 779H465" class="arrow"/>
  <rect x="140" y="715" width="310" height="128" rx="14" fill="#f2effb" stroke="#8e7ac6" stroke-width="2.2"/>
  <circle cx="179" cy="751" r="22" fill="#7662b3"/><text x="179" y="758" text-anchor="middle" class="cn num">4</text>
  <text x="295" y="760" text-anchor="middle" class="cn bt">迭代再生成</text><text x="295" y="799" text-anchor="middle" class="cn body">反馈驱动候选修正</text>
  <path d="M295 715V675H260V640" class="loop"/>
  <text x="352" y="677" class="cn small" fill="#6f5baa">进入下一轮</text>
  <path d="M1455 628V682H700V703" class="positive"/>
  <text x="1120" y="670" text-anchor="middle" class="cn small" fill="#41815c">提炼有效增益方向，形成正向反馈</text>
  <rect x="1025" y="726" width="985" height="104" rx="13" fill="#fff" stroke="#8ea39d" stroke-width="1.8"/>
  <text x="1517" y="764" text-anchor="middle" class="cn bt">统一质量原则</text>
  <text x="1517" y="792" text-anchor="middle" class="cn body">通过结果形成正向反馈并更新基线；未通过结果形成纠错反馈且不改变基线</text>

  <!-- connector --> <path d="M1885 920V957" class="arrow"/>

  <!-- Layer 3 -->
  <rect x="45" y="960" width="2110" height="245" rx="22" class="layer" fill="#fafbfc" stroke="#687987" filter="url(#shadow)"/>
  <circle cx="80" cy="994" r="21" fill="#657786"/><text x="80" y="1001" text-anchor="middle" class="cn num">3</text>
  <text x="116" y="1003" class="cn lh" fill="#536674">评价与成果层</text>
  <rect x="95" y="1045" width="440" height="105" rx="13" fill="#fff" stroke="#8799a6" stroke-width="2"/>
  <text x="315" y="1080" text-anchor="middle" class="cn bt">独立效果评价</text><text x="315" y="1118" text-anchor="middle" class="cn body">扩充质量 · 模型能力 · 稳定性</text>
  <path d="M535 1098H625" class="arrow"/>
  <rect x="640" y="1045" width="440" height="105" rx="13" fill="#edf4fd" stroke="#7795b1" stroke-width="2"/>
  <text x="860" y="1080" text-anchor="middle" class="cn bt">扩充前后能力验证</text><text x="860" y="1118" text-anchor="middle" class="cn body">比较数据质量与下游模型表现</text>
  <path d="M1080 1098H1170" class="arrow"/>
  <rect x="1185" y="1045" width="440" height="105" rx="13" fill="#eef7f1" stroke="#76a080" stroke-width="2"/>
  <text x="1405" y="1080" text-anchor="middle" class="cn bt">系统展示</text><text x="1405" y="1118" text-anchor="middle" class="cn body">呈现生成、验证、反馈与筛选过程</text>
  <path d="M1625 1098H1715" class="arrow"/>
  <rect x="1730" y="1045" width="375" height="105" rx="13" fill="#fff8e9" stroke="#c49a4a" stroke-width="2"/>
  <text x="1917" y="1080" text-anchor="middle" class="cn bt">研究成果</text><text x="1917" y="1118" text-anchor="middle" class="cn body">高质量数据与可复用扩充方法</text>
  <rect x="645" y="1222" width="910" height="28" rx="14" fill="#fff3e5" stroke="#e0a05d" stroke-width="1.5"/>
  <text x="1100" y="1243" text-anchor="middle" class="cn small" fill="#b36d2e">统一闭环连接异构任务输入、质量控制与能力验证</text>
</svg>
