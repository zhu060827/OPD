<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1280" viewBox="0 0 2200 1280">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#183246" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#506777"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7363B5"/>
    </marker>
    <style>
      .cn { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 52px; font-weight: 700; fill: #172B3A; }
      .subtitle { font-size: 24px; fill: #687B89; }
      .section { font-size: 25px; font-weight: 700; fill: #FFFFFF; }
      .boxTitle { font-size: 27px; font-weight: 700; fill: #203442; }
      .body { font-size: 21px; fill: #48606F; }
      .small { font-size: 19px; fill: #5C7180; }
      .stepNo { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
      .stepTitle { font-size: 26px; font-weight: 700; fill: #203442; }
      .stepBody { font-size: 19px; fill: #506675; }
      .arrow { fill: none; stroke: #506777; stroke-width: 4; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #7363B5; stroke-width: 5; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="2200" height="1280" fill="#F6F8FB"/>
  <text x="1100" y="78" text-anchor="middle" class="cn title">面向异构任务数据的统一质量可控扩充框架</text>
  <text x="1100" y="120" text-anchor="middle" class="cn subtitle">统一数据入口、任务约束与反馈闭环，实现扩充结果的生成、验证和筛选</text>

  <!-- Inputs -->
  <rect x="65" y="185" width="430" height="63" rx="31" fill="#355E7D"/>
  <text x="280" y="226" text-anchor="middle" class="cn section">异构任务数据输入</text>

  <g filter="url(#shadow)">
    <rect x="70" y="285" width="410" height="135" rx="23" fill="#EDF4FC" stroke="#8CB4E1" stroke-width="2"/>
    <rect x="70" y="455" width="410" height="135" rx="23" fill="#FFF7E9" stroke="#DFC083" stroke-width="2"/>
    <rect x="70" y="625" width="410" height="135" rx="23" fill="#ECF7F5" stroke="#83C8C0" stroke-width="2"/>
  </g>
  <circle cx="130" cy="352" r="30" fill="#3978C5"/>
  <path d="M113 338h34M113 352h34M113 366h34M124 332v40M136 332v40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="180" y="346" class="cn boxTitle">表格数据</text>
  <text x="180" y="382" class="cn body">原始特征、类别标签与任务描述</text>

  <circle cx="130" cy="522" r="30" fill="#B77A25"/>
  <text x="130" y="532" text-anchor="middle" class="cn" font-size="32" font-weight="700" fill="#FFFFFF">∑</text>
  <text x="180" y="516" class="cn boxTitle">数学推理数据</text>
  <text x="180" y="552" class="cn body">题目、推理过程与参考答案</text>

  <circle cx="130" cy="692" r="30" fill="#27817B"/>
  <path d="M121 679l-13 13 13 13M139 679l13 13-13 13" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="686" class="cn boxTitle">代码数据</text>
  <text x="180" y="722" class="cn body">任务、程序、推理与测试约束</text>

  <!-- Preprocessing -->
  <rect x="585" y="185" width="470" height="63" rx="31" fill="#355E7D"/>
  <text x="820" y="226" text-anchor="middle" class="cn section">统一数据预处理</text>
  <g filter="url(#shadow)">
    <rect x="565" y="285" width="510" height="475" rx="28" fill="#FFFFFF"/>
  </g>
  <rect x="610" y="325" width="420" height="92" rx="17" fill="#EFF4F8" stroke="#B7C8D4" stroke-width="2"/>
  <text x="820" y="363" text-anchor="middle" class="cn boxTitle">数据清洗与格式规范</text>
  <text x="820" y="397" text-anchor="middle" class="cn small">缺失、异常与格式一致性检查</text>

  <rect x="610" y="445" width="420" height="92" rx="17" fill="#EFF4F8" stroke="#B7C8D4" stroke-width="2"/>
  <text x="820" y="483" text-anchor="middle" class="cn boxTitle">结构化解析</text>
  <text x="820" y="517" text-anchor="middle" class="cn small">统一组织输入、目标与上下文信息</text>

  <rect x="610" y="565" width="420" height="92" rx="17" fill="#EFF4F8" stroke="#B7C8D4" stroke-width="2"/>
  <text x="820" y="603" text-anchor="middle" class="cn boxTitle">任务约束提取</text>
  <text x="820" y="637" text-anchor="middle" class="cn small">确定正确性边界与评价依据</text>

  <rect x="610" y="685" width="420" height="48" rx="17" fill="#E9F0F6"/>
  <text x="820" y="716" text-anchor="middle" class="cn small">形成标准化任务表示</text>

  <!-- Loop area -->
  <rect x="1145" y="185" width="985" height="63" rx="31" fill="#355E7D"/>
  <text x="1637" y="226" text-anchor="middle" class="cn section">生成—验证—反馈统一扩充闭环</text>
  <g filter="url(#shadow)">
    <rect x="1125" y="285" width="1025" height="665" rx="32" fill="#FFFFFF"/>
  </g>

  <!-- Loop connectors first -->
  <path d="M1405 410 C1510 305,1760 305,1860 410" class="loop"/>
  <path d="M1945 475 C2050 550,2050 675,1945 750" class="loop"/>
  <path d="M1860 820 C1745 920,1515 920,1405 820" class="loop"/>
  <path d="M1320 750 C1215 675,1215 550,1320 475" class="loop"/>

  <!-- Step 1 -->
  <rect x="1260" y="350" width="330" height="150" rx="24" fill="#EAF2FC" stroke="#8EB5E3" stroke-width="2"/>
  <circle cx="1300" cy="390" r="24" fill="#3978C5"/>
  <text x="1300" y="398" text-anchor="middle" class="cn stepNo">1</text>
  <text x="1425" y="397" text-anchor="middle" class="cn stepTitle">候选生成</text>
  <text x="1425" y="441" text-anchor="middle" class="cn stepBody">结合任务表示与历史反馈</text>
  <text x="1425" y="475" text-anchor="middle" class="cn stepBody">产生具有潜在价值的扩充内容</text>

  <!-- Step 2 -->
  <rect x="1775" y="350" width="330" height="150" rx="24" fill="#FFF2E8" stroke="#E4A46F" stroke-width="2"/>
  <circle cx="1815" cy="390" r="24" fill="#D57A36"/>
  <text x="1815" y="398" text-anchor="middle" class="cn stepNo">2</text>
  <text x="1940" y="397" text-anchor="middle" class="cn stepTitle">约束验证</text>
  <text x="1940" y="441" text-anchor="middle" class="cn stepBody">执行任务相关的可计算检查</text>
  <text x="1940" y="475" text-anchor="middle" class="cn stepBody">评价正确性、质量与潜在增益</text>

  <!-- Step 3 -->
  <rect x="1775" y="730" width="330" height="150" rx="24" fill="#F1EEFA" stroke="#B0A3DB" stroke-width="2"/>
  <circle cx="1815" cy="770" r="24" fill="#7363B5"/>
  <text x="1815" y="778" text-anchor="middle" class="cn stepNo">3</text>
  <text x="1940" y="777" text-anchor="middle" class="cn stepTitle">反馈优化</text>
  <text x="1940" y="821" text-anchor="middle" class="cn stepBody">归纳通过、拒绝及指标变化</text>
  <text x="1940" y="855" text-anchor="middle" class="cn stepBody">调整后续候选生成方向</text>

  <!-- Step 4 -->
  <rect x="1260" y="730" width="330" height="150" rx="24" fill="#F1EEFA" stroke="#B0A3DB" stroke-width="2"/>
  <circle cx="1300" cy="770" r="24" fill="#7363B5"/>
  <text x="1300" y="778" text-anchor="middle" class="cn stepNo">4</text>
  <text x="1425" y="777" text-anchor="middle" class="cn stepTitle">迭代再生成</text>
  <text x="1425" y="821" text-anchor="middle" class="cn stepBody">依据反馈修正或重新生成</text>
  <text x="1425" y="855" text-anchor="middle" class="cn stepBody">无有效增益时自适应停止</text>

  <!-- Center decision -->
  <polygon points="1637,493 1770,615 1637,737 1504,615" fill="#FFF8DF" stroke="#D0A230" stroke-width="3"/>
  <circle cx="1637" cy="565" r="24" fill="#D0A230"/>
  <text x="1637" y="573" text-anchor="middle" class="cn stepNo">5</text>
  <text x="1637" y="619" text-anchor="middle" class="cn stepTitle">择优保留</text>
  <text x="1637" y="657" text-anchor="middle" class="cn stepBody">满足约束且具有增益？</text>
  <text x="1637" y="690" text-anchor="middle" class="cn small">否则舍弃并保留当前基线</text>

  <!-- Main arrows -->
  <path d="M480 522H550" class="arrow"/>
  <path d="M1075 522H1220V425H1245" class="arrow"/>

  <!-- Outputs -->
  <path d="M1637 737V985" class="arrow"/>
  <text x="1660" y="936" class="cn small" fill="#297650">通过门控</text>
  <g filter="url(#shadow)">
    <rect x="505" y="1010" width="1590" height="180" rx="31" fill="#EAF6EE" stroke="#7DBB93" stroke-width="2"/>
  </g>
  <text x="1300" y="1055" text-anchor="middle" class="cn boxTitle" fill="#174F36">质量可控的扩充结果</text>

  <rect x="570" y="1080" width="420" height="74" rx="20" fill="#FFFFFF" stroke="#A5CEB4" stroke-width="2"/>
  <text x="780" y="1110" text-anchor="middle" class="cn body">保留有效扩充内容</text>
  <text x="780" y="1139" text-anchor="middle" class="cn small">形成可用于训练的数据结果</text>

  <rect x="1090" y="1080" width="420" height="74" rx="20" fill="#FFFFFF" stroke="#A5CEB4" stroke-width="2"/>
  <text x="1300" y="1110" text-anchor="middle" class="cn body">独立效果评价</text>
  <text x="1300" y="1139" text-anchor="middle" class="cn small">检验扩充质量与模型能力变化</text>

  <rect x="1610" y="1080" width="420" height="74" rx="20" fill="#FFFFFF" stroke="#A5CEB4" stroke-width="2"/>
  <text x="1820" y="1110" text-anchor="middle" class="cn body">可视化展示</text>
  <text x="1820" y="1139" text-anchor="middle" class="cn small">呈现生成、验证与筛选过程</text>

  <text x="1100" y="1245" text-anchor="middle" class="cn small">统一思想：以生成模型提出候选，以任务约束和可计算证据控制质量，以反馈驱动持续优化</text>
</svg>
