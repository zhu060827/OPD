<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1260" viewBox="0 0 2200 1260">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#51606b" flood-opacity="0.16"/></filter>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#34434c"/></marker>
    <marker id="arrP" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#7363b5"/></marker>
    <marker id="arrG" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#4b9662"/></marker>
    <style>
      .cn{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.title{font-size:37px;font-weight:750;fill:#172633}.panel{fill:#fff;stroke:#35434c;stroke-width:2.4;stroke-dasharray:10 7}.head{fill:#dce7ef;stroke:#35434c;stroke-width:2.4}.hn{font-size:25px;font-weight:750;font-style:italic;fill:#172633}.ht{font-size:27px;font-weight:750;fill:#172633}.bt{font-size:22px;font-weight:700;fill:#21343e}.body{font-size:18px;fill:#405762}.small{font-size:16px;fill:#5a6f79}.num{font-size:18px;font-weight:750;fill:#fff}.arrow{fill:none;stroke:#34434c;stroke-width:3.3;marker-end:url(#arr)}.loop{fill:none;stroke:#7363b5;stroke-width:3.3;stroke-dasharray:9 7;marker-end:url(#arrP)}.good{fill:none;stroke:#4b9662;stroke-width:3.3;stroke-dasharray:9 7;marker-end:url(#arrG)}
    </style>
  </defs>
  <rect width="2200" height="1260" fill="#fff"/>
  <text x="1100" y="55" text-anchor="middle" class="cn title">基于CART结构与XGBoost反馈的表格特征迭代扩充流程</text>

  <!-- 1 input and split -->
  <rect x="35" y="85" width="580" height="330" class="panel"/>
  <rect x="35" y="85" width="580" height="64" class="head"/>
  <text x="67" y="127" class="cn hn">1</text><text x="108" y="127" class="cn ht">表格数据输入与划分</text>
  <rect x="75" y="178" width="500" height="72" rx="11" fill="#eaf3ff" stroke="#7298ce" stroke-width="2"/>
  <text x="325" y="208" text-anchor="middle" class="cn bt">原始表格与任务描述</text><text x="325" y="234" text-anchor="middle" class="cn small">特征列、类别标签、数据语义与扩充目标</text>
  <path d="M325 250V278" class="arrow"/>
  <rect x="75" y="292" width="145" height="70" rx="10" fill="#edf5ec" stroke="#72a07a" stroke-width="2"/>
  <rect x="252" y="292" width="145" height="70" rx="10" fill="#fff4df" stroke="#c69a3c" stroke-width="2"/>
  <rect x="430" y="292" width="145" height="70" rx="10" fill="#f2f3f4" stroke="#87949c" stroke-width="2"/>
  <text x="147" y="322" text-anchor="middle" class="cn bt">训练集</text><text x="147" y="348" text-anchor="middle" class="cn small">生成依据</text>
  <text x="324" y="322" text-anchor="middle" class="cn bt">验证集</text><text x="324" y="348" text-anchor="middle" class="cn small">候选择优</text>
  <text x="502" y="322" text-anchor="middle" class="cn bt">测试集</text><text x="502" y="348" text-anchor="middle" class="cn small">最终评价</text>
  <text x="325" y="393" text-anchor="middle" class="cn small">固定分层划分；预处理参数仅由训练集拟合</text>

  <!-- 2 guidance -->
  <rect x="650" y="85" width="880" height="330" class="panel"/>
  <rect x="650" y="85" width="880" height="64" class="head"/>
  <text x="682" y="127" class="cn hn">2</text><text x="723" y="127" class="cn ht">训练集画像与生成依据</text>
  <rect x="690" y="178" width="185" height="116" rx="11" fill="#eaf3ff" stroke="#7298ce" stroke-width="2"/>
  <text x="782" y="211" text-anchor="middle" class="cn bt">数据画像</text><text x="782" y="245" text-anchor="middle" class="cn small">分位数、尺度</text><text x="782" y="271" text-anchor="middle" class="cn small">相关性与互信息</text>
  <rect x="895" y="178" width="185" height="116" rx="11" fill="#edf5ec" stroke="#72a07a" stroke-width="2"/>
  <text x="987" y="211" text-anchor="middle" class="cn bt">CART路径</text><text x="987" y="245" text-anchor="middle" class="cn small">分裂特征、阈值</text><text x="987" y="271" text-anchor="middle" class="cn small">局部条件组合</text>
  <rect x="1100" y="178" width="185" height="116" rx="11" fill="#fff0e7" stroke="#d48450" stroke-width="2"/>
  <text x="1192" y="211" text-anchor="middle" class="cn bt">XGBoost残差</text><text x="1192" y="245" text-anchor="middle" class="cn small">识别拟合不足区域</text><text x="1192" y="271" text-anchor="middle" class="cn small">预筛候选方向</text>
  <rect x="1305" y="178" width="185" height="116" rx="11" fill="#f1eefb" stroke="#8d7bc6" stroke-width="2"/>
  <text x="1397" y="211" text-anchor="middle" class="cn bt">历史反馈</text><text x="1397" y="245" text-anchor="middle" class="cn small">有效方向</text><text x="1397" y="271" text-anchor="middle" class="cn small">拒绝原因与修正建议</text>
  <path d="M782 294V327H1397V294" fill="none" stroke="#60727c" stroke-width="2.3"/>
  <rect x="870" y="323" width="440" height="54" rx="9" fill="#f5f7f8" stroke="#85939a" stroke-width="1.8"/>
  <text x="1090" y="357" text-anchor="middle" class="cn body">形成结构化提示与本地候选预筛依据</text>

  <!-- 4 final evaluation -->
  <rect x="1565" y="85" width="600" height="330" class="panel"/>
  <rect x="1565" y="85" width="600" height="64" class="head"/>
  <text x="1597" y="127" class="cn hn">4</text><text x="1638" y="127" class="cn ht">冻结输出与独立评价</text>
  <rect x="1610" y="177" width="510" height="64" rx="10" fill="#eaf6ed" stroke="#72a07a" stroke-width="2"/>
  <text x="1865" y="216" text-anchor="middle" class="cn bt">冻结预处理参数、公式与最终特征集合</text>
  <path d="M1865 241V267" class="arrow"/>
  <rect x="1610" y="280" width="240" height="88" rx="10" fill="#f4f5f5" stroke="#87949c" stroke-width="2"/>
  <text x="1730" y="313" text-anchor="middle" class="cn bt">独立测试</text><text x="1730" y="343" text-anchor="middle" class="cn small">多项分类指标</text>
  <rect x="1880" y="280" width="240" height="88" rx="10" fill="#fff5e4" stroke="#c69a3c" stroke-width="2"/>
  <text x="2000" y="313" text-anchor="middle" class="cn bt">贡献分析</text><text x="2000" y="343" text-anchor="middle" class="cn small">分裂、置换与删除重训</text>
  <text x="1865" y="395" text-anchor="middle" class="cn small">测试集与消融结果不反馈候选生成器</text>

  <!-- cross top arrows -->
  <path d="M615 245H638" class="arrow"/>
  <path d="M1090 415V451" class="arrow"/>

  <!-- 3 iterative loop -->
  <rect x="35" y="455" width="2130" height="750" class="panel"/>
  <rect x="35" y="455" width="2130" height="68" class="head"/>
  <text x="67" y="500" class="cn hn">3</text><text x="108" y="500" class="cn ht">LLM候选生成—约束验证—择优保留—反馈优化—迭代再生成</text>

  <rect x="85" y="585" width="290" height="142" rx="13" fill="#eaf3ff" stroke="#6793d0" stroke-width="2.2"/>
  <circle cx="126" cy="623" r="22" fill="#397bd0"/><text x="126" y="630" text-anchor="middle" class="cn num">1</text>
  <text x="230" y="632" text-anchor="middle" class="cn bt">LLM候选生成</text>
  <text x="230" y="671" text-anchor="middle" class="cn body">生成公式、假设与解释</text><text x="230" y="701" text-anchor="middle" class="cn small">多列、非线性、分段与路径特征</text>

  <path d="M375 656H442" class="arrow"/>
  <rect x="457" y="585" width="290" height="142" rx="13" fill="#fff0e7" stroke="#d48450" stroke-width="2.2"/>
  <circle cx="498" cy="623" r="22" fill="#db7937"/><text x="498" y="630" text-anchor="middle" class="cn num">2</text>
  <text x="602" y="632" text-anchor="middle" class="cn bt">公式约束验证</text>
  <text x="602" y="671" text-anchor="middle" class="cn body">语法、访问范围与数值检查</text><text x="602" y="701" text-anchor="middle" class="cn small">防止目标泄漏和不安全执行</text>

  <path d="M747 656H814" class="arrow"/>
  <rect x="829" y="585" width="300" height="142" rx="13" fill="#fff8df" stroke="#c69a3c" stroke-width="2.2"/>
  <circle cx="870" cy="623" r="22" fill="#c39128"/><text x="870" y="630" text-anchor="middle" class="cn num">3</text>
  <text x="979" y="632" text-anchor="middle" class="cn bt">验证集性能评价</text>
  <text x="979" y="671" text-anchor="middle" class="cn body">Macro F1提升</text><text x="979" y="701" text-anchor="middle" class="cn small">其他可用指标不退化</text>

  <path d="M1129 656H1192" class="arrow"/>
  <polygon points="1335,565 1478,656 1335,747 1192,656" fill="#fff8df" stroke="#c69a3c" stroke-width="2.5"/>
  <circle cx="1335" cy="610" r="21" fill="#c39128"/><text x="1335" y="617" text-anchor="middle" class="cn num">4</text>
  <text x="1335" y="654" text-anchor="middle" class="cn bt">择优保留</text><text x="1335" y="685" text-anchor="middle" class="cn small">满足约束且本轮最优？</text>

  <path d="M1478 656H1545" class="arrow"/><text x="1500" y="638" class="cn small" fill="#41815c">通过</text>
  <rect x="1560" y="585" width="290" height="142" rx="13" fill="#eaf6ed" stroke="#6d9e78" stroke-width="2.2"/>
  <text x="1705" y="632" text-anchor="middle" class="cn bt">接收候选</text><text x="1705" y="671" text-anchor="middle" class="cn body">加入当前特征集合</text><text x="1705" y="701" text-anchor="middle" class="cn small">更新验证基线</text>
  <path d="M1850 656H1913" class="arrow"/>
  <rect x="1928" y="585" width="190" height="142" rx="13" fill="#edf7f0" stroke="#6d9e78" stroke-width="2.2"/>
  <text x="2023" y="632" text-anchor="middle" class="cn bt">扩充结果</text><text x="2023" y="671" text-anchor="middle" class="cn body">保留新特征</text><text x="2023" y="701" text-anchor="middle" class="cn small">完成后冻结</text>

  <!-- feedback lower row -->
  <path d="M1335 747V805H1110" class="arrow"/><text x="1350" y="790" class="cn small" fill="#a2524b">未通过</text>
  <rect x="790" y="820" width="305" height="142" rx="13" fill="#f1eefb" stroke="#8d7bc6" stroke-width="2.2"/>
  <circle cx="831" cy="858" r="22" fill="#7363b5"/><text x="831" y="865" text-anchor="middle" class="cn num">5</text>
  <text x="942" y="867" text-anchor="middle" class="cn bt">反馈优化</text>
  <text x="942" y="906" text-anchor="middle" class="cn body">归纳有效方向与拒绝原因</text><text x="942" y="936" text-anchor="middle" class="cn small">形成下一轮修正策略</text>
  <path d="M1560 727V780H942V808" class="good"/>
  <text x="1280" y="774" text-anchor="middle" class="cn small" fill="#41815c">正向反馈：提炼有效关系</text>

  <path d="M790 891H715" class="arrow"/>
  <rect x="395" y="820" width="305" height="142" rx="13" fill="#f1eefb" stroke="#8d7bc6" stroke-width="2.2"/>
  <circle cx="436" cy="858" r="22" fill="#7363b5"/><text x="436" y="865" text-anchor="middle" class="cn num">6</text>
  <text x="547" y="867" text-anchor="middle" class="cn bt">迭代再生成</text>
  <text x="547" y="906" text-anchor="middle" class="cn body">根据反馈调整候选</text><text x="547" y="936" text-anchor="middle" class="cn small">达到停止条件后结束</text>
  <path d="M547 820V778H230V739" class="loop"/><text x="380" y="770" text-anchor="middle" class="cn small" fill="#6856a5">进入下一轮</text>

  <rect x="1210" y="860" width="850" height="110" rx="12" fill="#f5f7f8" stroke="#89989f" stroke-width="1.8"/>
  <text x="1635" y="900" text-anchor="middle" class="cn bt">数据隔离与质量原则</text>
  <text x="1635" y="934" text-anchor="middle" class="cn body">通过结果更新当前特征集合并形成正向反馈；未通过结果不改变基线并形成纠错反馈</text>

  <rect x="120" y="1045" width="1940" height="100" rx="12" fill="#fffaf0" stroke="#c9a25a" stroke-width="1.8"/>
  <text x="1090" y="1085" text-anchor="middle" class="cn bt">候选集合冻结后再进入独立测试与消融分析</text>
  <text x="1090" y="1119" text-anchor="middle" class="cn body">测试结果只用于报告扩充效果，消融结果只用于解释特征贡献，二者均不参与候选择优</text>
  <path d="M2023 727V1030" class="arrow"/>
  <path d="M2023 585V442H1865V427" class="arrow"/>
</svg>
