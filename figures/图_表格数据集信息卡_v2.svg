<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520">
  <rect width="1800" height="520" fill="#ffffff"/>
  <style>
    .cn{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    .en{font-family:Arial,"Helvetica Neue",sans-serif}
    .zhname{font-size:31px;font-weight:700;fill:#153d73}.enname{font-size:21px;font-weight:500;fill:#6a7f92}
    .lab{font-size:20px;fill:#64798c}.num{font-size:36px;font-weight:700;fill:#183e73}
    .result{font-size:28px;font-weight:700;fill:#237b45}.resultlab{font-size:20px;fill:#437459}
    .foot{font-size:23px;fill:#536a7d}.badge{font-size:23px;font-weight:700;fill:#ffffff}
  </style>

  <!-- card 1 -->
  <g>
    <rect x="35" y="30" width="555" height="390" rx="27" fill="#f5f9fd" stroke="#6fa6d8" stroke-width="3"/>
