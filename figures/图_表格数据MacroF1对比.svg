<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#fff"/>
  <style>.cn{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.title{font-size:47px;font-weight:700;fill:#143b73}.axis{font-size:27px;fill:#42596d}.tick{font-size:23px;fill:#576b7c}.label{font-size:27px;font-weight:600;fill:#263a4c}.value{font-size:27px;font-weight:700;fill:#1e3041}.gain{font-size:23px;font-weight:700;fill:#c44d2d}.note{font-size:24px;fill:#536779}</style>
  <text x="800" y="70" text-anchor="middle" class="cn title">独立测试集 Macro F1 对比</text>
  <g stroke="#dbe4ec" stroke-width="2">
    <line x1="150" y1="790" x2="1510" y2="790"/><line x1="150" y1="650" x2="1510" y2="650"/><line x1="150" y1="510" x2="1510" y2="510"/><line x1="150" y1="370" x2="1510" y2="370"/><line x1="150" y1="230" x2="1510" y2="230"/><line x1="150" y1="90" x2="1510" y2="90"/>
  </g>
  <g class="cn tick" text-anchor="end"><text x="130" y="798">0</text><text x="130" y="658">20</text><text x="130" y="518">40</text><text x="130" y="378">60</text><text x="130" y="238">80</text><text x="130" y="98">100</text></g>
  <line x1="150" y1="90" x2="150" y2="790" stroke="#9fb0bf" stroke-width="3"/><line x1="150" y1="790" x2="1510" y2="790" stroke="#9fb0bf" stroke-width="3"/>
  <text x="55" y="440" transform="rotate(-90 55 440)" text-anchor="middle" class="cn axis">Macro F1（%）</text>
  <!-- Jungle -->
  <rect x="260" y="397.8" width="145" height="392.2" rx="5" fill="#a7c7e7" stroke="#6e9bc7" stroke-width="3"/><rect x="420" y="298.5" width="145" height="491.5" rx="5" fill="#4e79b7" stroke="#315d97" stroke-width="3"/>
  <text x="332" y="379" text-anchor="middle" class="cn value">56.03%</text><text x="492" y="279" text-anchor="middle" class="cn value">70.22%</text><rect x="352" y="205" width="145" height="38" rx="17" fill="#fff0e8"/><text x="424" y="232" text-anchor="middle" class="cn gain">+14.18pp</text>
  <!-- Balance -->
  <rect x="690" y="382.3" width="145" height="407.7" rx="5" fill="#a7c7e7" stroke="#6e9bc7" stroke-width="3"/><rect x="850" y="223.1" width="145" height="566.9" rx="5" fill="#4e79b7" stroke="#315d97" stroke-width="3"/>
  <text x="762" y="363" text-anchor="middle" class="cn value">58.24%</text><text x="922" y="204" text-anchor="middle" class="cn value">80.99%</text><rect x="782" y="130" width="145" height="38" rx="17" fill="#fff0e8"/><text x="854" y="157" text-anchor="middle" class="cn gain">+22.76pp</text>
  <!-- KRK -->
  <rect x="1120" y="530.7" width="145" height="259.3" rx="5" fill="#a7c7e7" stroke="#6e9bc7" stroke-width="3"/><rect x="1280" y="506.8" width="145" height="283.2" rx="5" fill="#4e79b7" stroke="#315d97" stroke-width="3"/>
  <text x="1192" y="512" text-anchor="middle" class="cn value">37.05%</text><text x="1352" y="488" text-anchor="middle" class="cn value">40.46%</text><rect x="1212" y="400" width="145" height="38" rx="17" fill="#fff0e8"/><text x="1284" y="427" text-anchor="middle" class="cn gain">+3.41pp</text>
  <g class="cn label" text-anchor="middle"><text x="412" y="845">Jungle Chess</text><text x="842" y="845">Balance Scale</text><text x="1272" y="845">Chess KRK</text></g>
  <g class="cn note"><rect x="510" y="890" width="26" height="26" fill="#a7c7e7"/><text x="550" y="912">原始特征</text><rect x="820" y="890" width="26" height="26" fill="#4e79b7"/><text x="860" y="912">LLM扩充后</text></g>
</svg>
