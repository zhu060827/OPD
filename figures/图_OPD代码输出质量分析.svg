<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1250" viewBox="0 0 1100 1250">
  <rect width="1100" height="1250" fill="#ffffff"/>
  <style>
    .cn { font-family: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; }
    .title { font-size: 48px; font-weight: 700; fill: #143b73; }
    .cardTitle { font-size: 25px; font-weight: 600; fill: #3f566b; }
    .metric { font-size: 55px; font-weight: 700; fill: #143b73; }
    .section { font-size: 34px; font-weight: 700; fill: #233d5b; }
    .legend { font-size: 23px; fill: #31485c; }
    .body { font-size: 26px; fill: #334b60; }
    .small { font-size: 22px; fill: #5b6f80; }
  </style>

  <text x="550" y="75" text-anchor="middle" class="cn title">代码输出质量与HumanEval结果</text>

  <!-- metric cards -->
  <g>
    <rect x="55" y="125" width="305" height="215" rx="24" fill="#eef5fb" stroke="#70a6d8" stroke-width="3"/>
    <circle cx="207" cy="185" r="30" fill="#4e73b8"/>
    <path d="M192 185 l10 11 22 -25" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="207" y="267" text-anchor="middle" class="cn metric">100%</text>
    <text x="207" y="310" text-anchor="middle" class="cn cardTitle">代码提取率</text>

    <rect x="397" y="125" width="305" height="215" rx="24" fill="#eef5fb" stroke="#70a6d8" stroke-width="3"/>
    <circle cx="549" cy="185" r="30" fill="#4e73b8"/>
    <text x="549" y="196" text-anchor="middle" class="cn" font-size="35" font-weight="700" fill="#fff">{ }</text>
    <text x="549" y="267" text-anchor="middle" class="cn metric">99%以上</text>
    <text x="549" y="310" text-anchor="middle" class="cn cardTitle">语法正确率</text>

    <rect x="739" y="125" width="305" height="215" rx="24" fill="#eef5fb" stroke="#70a6d8" stroke-width="3"/>
    <circle cx="891" cy="185" r="30" fill="#4e73b8"/>
    <path d="M875 174 h32 v22 h-32 z M881 181 h20" fill="none" stroke="#fff" stroke-width="5"/>
    <text x="891" y="267" text-anchor="middle" class="cn metric">95%以上</text>
    <text x="891" y="310" text-anchor="middle" class="cn cardTitle">接口匹配率</text>
  </g>

  <!-- HumanEval -->
  <rect x="55" y="390" width="990" height="520" rx="28" fill="#f8fafc" stroke="#cbd8e5" stroke-width="3"/>
  <text x="100" y="455" class="cn section">HumanEval结果组成（164题）</text>

  <!-- legend -->
  <rect x="100" y="500" width="24" height="24" rx="5" fill="#4e73b8"/>
  <text x="137" y="520" class="cn legend">通过 107（65.2%）</text>
  <rect x="395" y="500" width="24" height="24" rx="5" fill="#a9c7df"/>
  <text x="432" y="520" class="cn legend">测试失败 56（34.1%）</text>
  <rect x="750" y="500" width="24" height="24" rx="5" fill="#e995ae"/>
  <text x="787" y="520" class="cn legend">语法错误 1（0.6%）</text>

  <!-- stacked bar -->
  <clipPath id="barclip"><rect x="100" y="570" width="900" height="105" rx="20"/></clipPath>
  <g clip-path="url(#barclip)">
    <rect x="100" y="570" width="586.8" height="105" fill="#4e73b8"/>
    <rect x="686.8" y="570" width="306.9" height="105" fill="#a9c7df"/>
    <rect x="993.7" y="570" width="6.3" height="105" fill="#e995ae"/>
  </g>
  <text x="393" y="636" text-anchor="middle" class="cn" font-size="31" font-weight="700" fill="#fff">107题通过</text>
  <text x="840" y="636" text-anchor="middle" class="cn" font-size="27" font-weight="700" fill="#233d5b">56题测试失败</text>

  <rect x="100" y="728" width="900" height="132" rx="18" fill="#eef5fb"/>
  <circle cx="150" cy="794" r="27" fill="#4e73b8"/>
  <text x="150" y="804" text-anchor="middle" class="cn" font-size="32" font-weight="700" fill="#fff">i</text>
  <text x="195" y="780" class="cn body">HumanEval失败主要来自功能测试，</text>
  <text x="195" y="824" class="cn body">语法错误仅1例，代码格式与接口生成较为稳定。</text>
  
  <!-- caveat -->
  <rect x="55" y="960" width="990" height="200" rx="26" fill="#fff7eb" stroke="#dfb45b" stroke-width="3"/>
  <text x="100" y="1020" class="cn section" fill="#825b16">跨数据集表现</text>
  <text x="100" y="1075" class="cn body">HumanEval：Base 68.3% → OPD 65.2%</text>
  <text x="100" y="1125" class="cn small">跨数据集性能未同步提升，后续需加强程序语义正确性与泛化能力。</text>
</svg>
