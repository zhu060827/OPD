<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350">
  <defs>
    <style>
      .title{font:700 42px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#22313f}
      .section{font:700 28px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#263746}
      .head{font:700 25px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#253746}
      .body{font:400 20px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#566675}
      .small{font:400 17px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#657482}
      .num{font:700 22px 'Arial',sans-serif;fill:white}
      .flow{stroke:#394956;stroke-width:5;fill:none;marker-end:url(#arrow)}
      .feedback{stroke:#5c9f68;stroke-width:4;stroke-dasharray:12 10;fill:none;marker-end:url(#arrowGreen)}
      .thin{stroke:#78909c;stroke-width:3;fill:none;marker-end:url(#arrowSmall)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#394956"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#5c9f68"/></marker>
    <marker id="arrowSmall" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#78909c"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#78909c" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="2400" height="1350" fill="#ffffff"/>
  <text x="1200" y="70" text-anchor="middle" class="title">基于执行验证与 OPD 反馈的代码数据迭代扩充流程</text>

  <!-- top overview panels -->
  <rect x="42" y="110" width="2316" height="330" rx="18" fill="#fbfdff" stroke="#4d78a8" stroke-width="3" stroke-dasharray="11 8"/>

  <!-- 1 input and audit -->
  <rect x="42" y="110" width="610" height="58" fill="#dce8ef" stroke="#526b7a" stroke-width="2"/>
  <text x="68" y="149" class="section"><tspan font-style="italic">1</tspan><tspan dx="18">代码数据输入与审计</tspan></text>
  <rect x="75" y="190" width="544" height="72" rx="13" fill="#eaf3ff" stroke="#75a5df" stroke-width="3"/>
  <text x="347" y="222" text-anchor="middle" class="head">题目、参考代码与单元测试</text>
  <text x="347" y="249" text-anchor="middle" class="small">MBPP · MBPP-sanitized · HumanEval</text>
  <rect x="75" y="288" width="164" height="76" rx="12" fill="#edf7ee" stroke="#77ad83" stroke-width="2"/>
  <text x="157" y="319" text-anchor="middle" class="body">语法检查</text><text x="157" y="348" text-anchor="middle" class="small">代码可解析</text>
  <rect x="265" y="288" width="164" height="76" rx="12" fill="#fff5dc" stroke="#d4ab43" stroke-width="2"/>
  <text x="347" y="319" text-anchor="middle" class="body">接口提取</text><text x="347" y="348" text-anchor="middle" class="small">函数签名明确</text>
  <rect x="455" y="288" width="164" height="76" rx="12" fill="#f2f4f6" stroke="#91a3ad" stroke-width="2"/>
  <text x="537" y="319" text-anchor="middle" class="body">测试审计</text><text x="537" y="348" text-anchor="middle" class="small">测试用例完整</text>
  <text x="347" y="397" text-anchor="middle" class="small">仅保留可解析、接口明确且具备执行验证条件的样本</text>

  <!-- 2 task construction -->
  <rect x="670" y="110" width="1244" height="58" fill="#dce8ef" stroke="#526b7a" stroke-width="2"/>
  <text x="696" y="149" class="section"><tspan font-style="italic">2</tspan><tspan dx="18">代码解析与多策略改写任务构建</tspan></text>
  <path d="M620 275 H660" class="flow"/>
  <rect x="710" y="190" width="270" height="130" rx="14" fill="#eaf3ff" stroke="#75a5df" stroke-width="3"/>
  <text x="845" y="230" text-anchor="middle" class="head">代码结构解析</text>
  <text x="845" y="270" text-anchor="middle" class="body">函数接口 · AST结构</text>
  <text x="845" y="300" text-anchor="middle" class="small">推理说明与测试约束</text>
  <path d="M981 255 H1031" class="flow"/>
  <rect x="1055" y="190" width="440" height="130" rx="14" fill="#edf7ee" stroke="#77ad83" stroke-width="3"/>
  <text x="1275" y="228" text-anchor="middle" class="head">改写方向选择</text>
  <text x="1275" y="267" text-anchor="middle" class="body">推理说明 · 代码风格 · 语法结构</text>
  <text x="1275" y="300" text-anchor="middle" class="body">变量命名 · 控制流</text>
  <path d="M1496 255 H1546" class="flow"/>
  <rect x="1570" y="190" width="305" height="130" rx="14" fill="#fff7df" stroke="#d4ab43" stroke-width="3"/>
  <text x="1722" y="230" text-anchor="middle" class="head">改写任务构建</text>
  <text x="1722" y="270" text-anchor="middle" class="body">限定目标与保持项</text>
  <text x="1722" y="300" text-anchor="middle" class="small">形成结构化生成提示</text>
  <rect x="805" y="348" width="975" height="48" rx="11" fill="#f6f8fa" stroke="#91a3ad" stroke-width="2"/>
  <text x="1292" y="379" text-anchor="middle" class="body">形成：题目 + 原始代码 + 推理说明 + 单元测试 + 指定改写方向</text>

  <!-- 4 output and evaluation -->
  <rect x="1930" y="110" width="428" height="58" fill="#dce8ef" stroke="#526b7a" stroke-width="2"/>
  <text x="1956" y="149" class="section"><tspan font-style="italic">4</tspan><tspan dx="18">扩充输出与统一评价</tspan></text>
  <rect x="1960" y="188" width="364" height="66" rx="12" fill="#eaf6ec" stroke="#6da678" stroke-width="3" filter="url(#shadow)"/>
  <text x="2142" y="217" text-anchor="middle" class="head">保留原始功能并输出扩充代码</text>
  <text x="2142" y="244" text-anchor="middle" class="small">保存改写说明与验证结果</text>
  <rect x="1960" y="270" width="172" height="80" rx="12" fill="#f4f6f8" stroke="#91a3ad" stroke-width="2"/>
  <text x="2046" y="301" text-anchor="middle" class="body">方法对比</text>
  <text x="2046" y="332" text-anchor="middle" class="small">原始 · 单次 · 反馈优化</text>
  <rect x="2152" y="270" width="172" height="80" rx="12" fill="#fff7df" stroke="#d3a13d" stroke-width="2"/>
  <text x="2238" y="301" text-anchor="middle" class="body">统一评价</text>
  <text x="2238" y="332" text-anchor="middle" class="small">语义 · 质量 · pass@1</text>
  <text x="2142" y="382" text-anchor="middle" class="small">MBPP · MBPP-sanitized · HumanEval</text>

  <!-- iterative expansion layer -->
  <rect x="42" y="475" width="2316" height="820" rx="18" fill="#fcfefd" stroke="#238f86" stroke-width="4" stroke-dasharray="12 8"/>
  <rect x="42" y="475" width="2316" height="66" fill="#dce8ef" stroke="#526b7a" stroke-width="2"/>
  <text x="70" y="519" class="section"><tspan font-style="italic">3</tspan><tspan dx="18" fill="#3f6dcc">候选改写—语义验证—质量评价—OPD引导—反馈优化—代码更新</tspan></text>

  <path d="M1200 440 V580" class="flow"/>

  <!-- main sequence -->
  <rect x="95" y="625" width="285" height="145" rx="16" fill="#eaf3ff" stroke="#77a8e2" stroke-width="3"/>
  <circle cx="135" cy="666" r="25" fill="#397bd1"/><text x="135" y="674" text-anchor="middle" class="num">1</text>
  <text x="238" y="676" text-anchor="middle" class="head">候选改写</text>
  <text x="238" y="720" text-anchor="middle" class="body">按指定方向生成代码</text>

  <path d="M381 697 H430" class="flow"/>
  <rect x="455" y="625" width="285" height="145" rx="16" fill="#fff1e7" stroke="#e89254" stroke-width="3"/>
  <circle cx="495" cy="666" r="25" fill="#e98037"/><text x="495" y="674" text-anchor="middle" class="num">2</text>
  <text x="598" y="676" text-anchor="middle" class="head">语义验证</text>
  <text x="598" y="720" text-anchor="middle" class="body">接口、编译与单元测试</text>

  <path d="M741 697 H790" class="flow"/>
  <rect x="815" y="625" width="285" height="145" rx="16" fill="#fff8dc" stroke="#d4aa3d" stroke-width="3"/>
  <circle cx="855" cy="666" r="25" fill="#d5a421"/><text x="855" y="674" text-anchor="middle" class="num">3</text>
  <text x="958" y="676" text-anchor="middle" class="head">质量评价</text>
  <text x="958" y="712" text-anchor="middle" class="body">目标指标改善</text>
  <text x="958" y="744" text-anchor="middle" class="small">其他指标无明显退化</text>

  <path d="M1101 697 H1152" class="flow"/>
  <polygon points="1290,597 1422,697 1290,797 1158,697" fill="#fff8dd" stroke="#cf9c24" stroke-width="3"/>
  <text x="1290" y="686" text-anchor="middle" class="head">质量门控</text>
  <text x="1290" y="725" text-anchor="middle" class="body">语义有效且有增益？</text>

  <text x="1462" y="675" class="small" fill="#3e8d59">通过</text>
  <path d="M1423 697 H1510" class="flow"/>
  <rect x="1535" y="625" width="285" height="145" rx="16" fill="#eaf6ec" stroke="#6da678" stroke-width="3"/>
  <circle cx="1575" cy="666" r="25" fill="#4f9b60"/><text x="1575" y="674" text-anchor="middle" class="num">4</text>
  <text x="1678" y="676" text-anchor="middle" class="head">择优保留</text>
  <text x="1678" y="712" text-anchor="middle" class="body">更新当前代码基线</text>
  <text x="1678" y="744" text-anchor="middle" class="small">提炼有效改写方向</text>

  <path d="M1821 697 H1870" class="flow"/>
  <rect x="1895" y="625" width="375" height="145" rx="16" fill="#edf8f0" stroke="#6da678" stroke-width="3"/>
  <text x="2082" y="676" text-anchor="middle" class="head">代码更新</text>
  <text x="2082" y="712" text-anchor="middle" class="body">保留行为一致且质量提升的代码</text>
  <text x="2082" y="744" text-anchor="middle" class="small">记录质量增益与改写方向</text>
  <path d="M2270 697 H2328 V420 H2142 V396" class="flow"/>

  <!-- lower OPD and feedback path -->
  <path d="M1290 798 V858 H1110" class="flow"/>
  <text x="1312" y="842" class="small">未通过</text>
  <rect x="790" y="850" width="320" height="145" rx="16" fill="#f2edff" stroke="#9177c7" stroke-width="3"/>
  <circle cx="830" cy="891" r="25" fill="#8066b7"/><text x="830" y="899" text-anchor="middle" class="num">5</text>
  <text x="950" y="901" text-anchor="middle" class="head">反馈优化</text>
  <text x="950" y="938" text-anchor="middle" class="body">归纳有效方向与失败原因</text>
  <text x="950" y="970" text-anchor="middle" class="small">形成正向反馈或纠错建议</text>

  <path d="M789 922 H735" class="flow"/>
  <rect x="410" y="850" width="325" height="145" rx="16" fill="#eeeaff" stroke="#9177c7" stroke-width="3"/>
  <circle cx="450" cy="891" r="25" fill="#8066b7"/><text x="450" y="899" text-anchor="middle" class="num">6</text>
  <text x="572" y="901" text-anchor="middle" class="head">迭代再生成</text>
  <text x="572" y="940" text-anchor="middle" class="body">依据反馈调整改写方向</text>
  <path d="M572 850 V810 H238 V775" class="flow"/>
  <text x="278" y="827" class="small">进入下一轮</text>

  <!-- positive feedback from accepted candidate -->
  <path d="M1678 771 V820 H1115 V875" class="feedback"/>
  <text x="1398" y="810" text-anchor="middle" class="small" fill="#4c8d5a">正向反馈：提炼有效关系并继续探索</text>

  <!-- OPD block -->
  <rect x="1165" y="875" width="1070" height="250" rx="16" fill="#f7fbff" stroke="#6f96b1" stroke-width="3"/>
  <text x="1700" y="915" text-anchor="middle" class="head">OPD 教师—学生分布差异分析</text>
  <rect x="1210" y="950" width="240" height="95" rx="12" fill="#eaf3ff" stroke="#77a8e2" stroke-width="2"/>
  <text x="1330" y="987" text-anchor="middle" class="body">学生生成轨迹</text>
  <text x="1330" y="1020" text-anchor="middle" class="small">同一代码序列</text>
  <path d="M1452 997 H1500" class="thin"/>
  <rect x="1520" y="950" width="300" height="95" rx="12" fill="#fff5e8" stroke="#dca062" stroke-width="2"/>
  <text x="1670" y="987" text-anchor="middle" class="body">教师 / 学生 Top-k 分布</text>
  <text x="1670" y="1020" text-anchor="middle" class="small">相同上下文评分</text>
  <path d="M1822 997 H1870" class="thin"/>
  <rect x="1890" y="950" width="300" height="95" rx="12" fill="#edf7ee" stroke="#77ad83" stroke-width="2"/>
  <text x="2040" y="987" text-anchor="middle" class="body">KL · TV · NLL 差异</text>
  <text x="2040" y="1020" text-anchor="middle" class="small">归因并选择改写方向</text>
  <path d="M2040 1047 V1090 H950 V997" class="feedback"/>
  <text x="1510" y="1081" text-anchor="middle" class="small" fill="#4c8d5a">分布差异提供方向反馈，不替代执行验证</text>

  <!-- principle box -->
  <rect x="120" y="1160" width="2110" height="92" rx="14" fill="#ffffff" stroke="#91a7b4" stroke-width="2"/>
  <text x="1175" y="1197" text-anchor="middle" class="head">统一质量原则</text>
  <text x="1175" y="1233" text-anchor="middle" class="body">语义验证控制功能正确性 · 质量评价判断改写增益 · OPD反馈引导后续方向 · 未通过候选不改变当前代码基线</text>
</svg>
