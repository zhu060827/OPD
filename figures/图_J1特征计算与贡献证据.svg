<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#edf5fc"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#173f7a"/><stop offset="1" stop-color="#345d9d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#173f7a" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#3975b9"/></marker>
  </defs>
  <rect width="1800" height="920" rx="30" fill="url(#bg)"/>
  <rect x="42" y="34" width="1716" height="92" rx="28" fill="url(#head)"/>
  <text x="900" y="94" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="43" font-weight="700" fill="#fff">代表性特征 J₁ 的计算与贡献证据</text>

  <text x="82" y="183" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#173f7a">特征计算：将棋子力量差转换为方向明确、尺度平滑的新特征</text>
  <g filter="url(#shadow)">
    <rect x="75" y="218" width="335" height="158" rx="24" fill="#fff" stroke="#75a8dc" stroke-width="3"/>
    <circle cx="135" cy="277" r="32" fill="#4f7fc4"/><text x="135" y="288" text-anchor="middle" font-family="serif" font-size="32" fill="#fff">♔</text>
    <text x="188" y="270" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#183d72">白方棋子强度</text>
    <text x="188" y="326" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#1d508d">7</text>

    <rect x="75" y="405" width="335" height="158" rx="24" fill="#fff" stroke="#75a8dc" stroke-width="3"/>
    <circle cx="135" cy="464" r="32" fill="#7995b8"/><text x="135" y="475" text-anchor="middle" font-family="serif" font-size="32" fill="#fff">♚</text>
    <text x="188" y="457" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#183d72">黑方棋子强度</text>
    <text x="188" y="513" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#1d508d">6</text>
  </g>
  <path d="M430 297 C520 297 520 365 595 365" fill="none" stroke="#3975b9" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M430 484 C520 484 520 409 595 409" fill="none" stroke="#3975b9" stroke-width="7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="620" y="265" width="500" height="250" rx="28" fill="#fff" stroke="#4e84bf" stroke-width="3"/></g>
  <text x="870" y="324" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#173f7a">方向保留的对数力量差</text>
  <text x="870" y="394" text-anchor="middle" font-family="Cambria Math,Times New Roman,serif" font-size="38" fill="#152f50">J₁ = sign(Δ) · ln(1 + |Δ|)</text>
  <text x="870" y="451" text-anchor="middle" font-family="Cambria Math,Times New Roman,serif" font-size="34" fill="#d8672a">Δ = 7 − 6 = 1，J₁ = ln(2) = 0.6931</text>
  <path d="M1148 390 L1265 390" stroke="#3975b9" stroke-width="7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="1295" y="265" width="430" height="250" rx="28" fill="#eef8f1" stroke="#55a874" stroke-width="3"/></g>
  <text x="1510" y="326" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#267349">单样本预测变化</text>
  <text x="1510" y="400" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="34" fill="#30485d">类别 b</text>
  <text x="1510" y="448" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#d8672a">修正为正确类别 d</text>

  <line x1="75" y1="610" x2="1725" y2="610" stroke="#b8cee4" stroke-width="2"/>
  <text x="82" y="666" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#173f7a">整体贡献：使用全体测试样本评估特征是否被模型利用</text>
  <g filter="url(#shadow)">
    <rect x="75" y="700" width="500" height="155" rx="24" fill="#fff" stroke="#75a8dc" stroke-width="3"/>
    <rect x="650" y="700" width="500" height="155" rx="24" fill="#fff" stroke="#75a8dc" stroke-width="3"/>
    <rect x="1225" y="700" width="500" height="155" rx="24" fill="#eef8f1" stroke="#55a874" stroke-width="3"/>
  </g>
  <text x="325" y="750" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#526b83">XGBoost分裂使用</text>
  <text x="325" y="815" text-anchor="middle" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="#174d8b">244 次</text>
  <text x="900" y="750" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#526b83">重复置换重要性</text>
  <text x="900" y="810" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#174d8b">Macro F1 ↓ 0.1424</text>
  <text x="900" y="838" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#6b7f91">± 0.0031</text>
  <text x="1475" y="750" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="25" fill="#42705a">删除特征后重训</text>
  <text x="1475" y="815" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#21804b">Macro F1 ↓ 0.0484</text>
  <text x="900" y="897" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#60758a">单样本用于说明计算过程；整体指标用于判断特征贡献。</text>
</svg>
