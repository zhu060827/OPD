    - +actor_rollout_ref.rollout.reward_weight_mode=teacher_p
    - +actor_rollout_ref.rollout.teacher_temperature=1.0
    - reward_model.enable=True
    - reward_model.model.path=/home/asus/OPD/-OPD/teacher_model
    - reward_model.model.input_tokenizer=null
    - reward_model.model.use_remove_padding=True
    - reward_model.model.fsdp_config.param_offload=True
    - +reward_model.model.dtype=bf16
    - reward_model.micro_batch_size_per_gpu=1
    - custom_reward_function.path=/home/asus/OPD/-OPD/code_rewrite_feedback_expander/mbpp_reward.py
    - custom_reward_function.name=reward_func
    - trainer.n_gpus_per_node=1
    - trainer.nnodes=1
    - trainer.total_epochs=200
    - trainer.total_training_steps=200
    - trainer.save_freq=20
    - trainer.test_freq=-1
    - trainer.val_before_train=False
    - trainer.balance_batch=False
    - trainer.logger=["console"]
    - trainer.project_name=mbpp_qwen3_opd
    - trainer.experiment_name=qwen3_1p7b_from_qwen3_4b_steps200_bs16
    - trainer.default_local_dir=/home/asus/OPD/-OPD/OPD-main/checkpoints/mbpp_qwen3_opd/qwen3_1p7b_from_qwen3_4b_steps200_bs16
  job:
    name: main_ppo
    chdir: null
    override_dirname: +actor_rollout_ref.rollout.log_prob_top_k=16,+actor_rollout_ref.rollout.reward_weight_mode=teacher_p,+actor_rollout_ref.rollout.teacher_temperature=1.0,+actor_rollout_ref.rollout.top_k_strategy=union,+data.apply_chat_template_kwargs.enable_thinking=True,+reward_model.model.dtype=bf16,actor_rollout_ref.actor.fsdp_config.forward_prefetch=False,actor_rollout_ref.actor.fsdp_config.model_dtype=bf16,actor_rollout_ref.actor.fsdp_config.optimizer_offload=True,actor_rollout_ref.actor.fsdp_config.param_offload=True,actor_rollout_ref.actor.loss_agg_mode=token-mean,actor_rollout_ref.actor.optim.lr=1e-6,actor_rollout_ref.actor.ppo_epochs=1,actor_rollout_ref.actor.ppo_max_token_len_per_gpu=1536,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1,actor_rollout_ref.actor.ppo_mini_batch_size=16,actor_rollout_ref.actor.use_dynamic_bsz=False,actor_rollout_ref.actor.use_kl_loss=False,actor_rollout_ref.actor.use_torch_compile=False,actor_rollout_ref.model.enable_activation_offload=True,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=/home/asus/OPD/-OPD/student_model,actor_rollout_ref.model.use_remove_padding=True,actor_rollout_ref.rollout.calculate_log_probs=True,actor_rollout_ref.rollout.free_cache_engine=True,actor_rollout_ref.rollout.gpu_memory_utilization=0.55,actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu=1536,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.log_prob_use_dynamic_bsz=True,actor_rollout_ref.rollout.max_model_len=1536,actor_rollout_ref.rollout.max_num_batched_tokens=1536,actor_rollout_ref.rollout.n=1,actor_rollout_ref.rollout.name=vllm,actor_rollout_ref.rollout.temperature=1.0,actor_rollout_ref.rollout.tensor_model_parallel_size=1,algorithm.adv_estimator=token_reward_direct,algorithm.use_kl_in_reward=False,custom_reward_function.name=reward_func,custom_reward_function.path=/home/asus/OPD/-OPD/code_rewrite_feedback_expander/mbpp_reward.py,data.filter_overlo