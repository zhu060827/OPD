      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.3'
    cwd: /home/asus/OPD/-OPD/OPD-main
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/asus/OPD/-OPD/OPD-main/verl/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/asus/OPD/-OPD/OPD-main/outputs/2026-08-20/12-40-29
    choices:
      algorithm@@algorithm.rollout_correction: rollout_correction
      reward_model: dp_reward_model
      critic: dp_critic
      critic/../engine@critic.model.fsdp_config: fsdp
      critic/../optim@critic.optim: fsdp
      model@actor_rollout_ref.model: hf_model
      rollout@actor_rollout_ref.rollout: rollout
      ref@actor_rollout_ref.ref: dp_ref
      ref/../engine@actor_rollout_ref.ref.fsdp_config: fsdp
      data: legacy_data
      actor@actor_rollout_ref.actor: dp_actor
